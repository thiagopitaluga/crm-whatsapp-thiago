services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    env_file: .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${DATABASE_CONNECTION_URI}
      DATABASE_CONNECTION_CLIENT_NAME: organizap_evolution
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: organizap
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      TELEMETRY_ENABLED: 'false'
      QRCODE_LIMIT: 30
      DEL_INSTANCE: 'false'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-internal

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evolution-internal

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-internal

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution-internal:
    name: organizap-evolution-internal
